<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Room · Rádio do Clube</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#b02ee0,#2a4fff 55%,#1fb5b0) fixed;min-height:100vh;padding:20px;color:#fff}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
.g{padding:20px;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.08));backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 16px 48px rgba(0,0,0,.25)}
h1{font-size:24px;font-weight:800}h2{font-size:15px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password]{flex:1;min-width:130px;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;font:500 14px 'Poppins'}
::placeholder{color:rgba(255,255,255,.7)}
button{padding:9px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.22);color:#fff;font:600 13px 'Poppins';cursor:pointer}
button:hover{background:rgba(255,255,255,.4)}
button.red{background:rgba(255,40,90,.55)}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;margin-top:6px;background:rgba(255,255,255,.12)}
.item.cur{background:rgba(255,255,255,.32)}
.item img,.item i{width:44px;height:44px;border-radius:10px;object-fit:cover;background:rgba(0,0,0,.25);flex:none}
.item div{flex:1;min-width:0;font-size:14px;font-weight:600}.item small{display:block;font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item button{padding:6px 10px}
#msg{font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="g row" style="justify-content:space-between"><h1>🎛 Control Room</h1><span id="stat">…</span></div>
  <div class="g">
    <h2>Rádio</h2>
    <div class="row">
      <button onclick="cmd({cmd:'start'})">▶ Iniciar</button>
      <button class="red" onclick="cmd({cmd:'stop'})">■ Parar rádio</button>
      <button onclick="cmd({cmd:'prev'})">⏮</button><button onclick="cmd({cmd:'next'})">⏭ Pular</button>
    </div>
    <p style="margin-top:12px;font-size:14px">Agora: <b id="now">—</b> · 👥 <b id="cnt">0</b> ouvindo</p>
  </div>
  <div class="g">
    <h2>Adicionar música</h2>
    <div class="row"><input type="text" id="url" placeholder="Link do YouTube, Spotify ou áudio direto"></div>
    <div class="row" style="margin-top:8px"><input type="text" id="ttl" placeholder="Título (opcional)"><input type="text" id="art" placeholder="Artista (opcional)"><button onclick="addLink()">Adicionar link</button></div>
    <div class="row" style="margin-top:8px"><input type="file" id="file" accept="audio/*" style="flex:1"><button onclick="addFile()">Enviar arquivo</button></div>
    <p id="msg"></p>
  </div>
  <div class="g"><h2>Playlist (<span id="n">0</span>)</h2><div id="list"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let pw=sessionStorage.getItem('pw')||prompt('Senha do Control Room:')||'';
sessionStorage.setItem('pw',pw);
const msg=(t,err)=>{$('msg').textContent=t;$('msg').style.color=err?'#ffd0d8':'#fff'};
async function cmd(o,file){
  const f=new FormData();Object.entries(o).forEach(([k,v])=>f.append(k,v));if(file)f.append('file',file);
  const r=await fetch('/api/cmd',{method:'POST',headers:{'x-password':pw},body:f});
  const j=await r.json();
  if(!r.ok){msg(j.error,1);if(r.status===401){sessionStorage.removeItem('pw');}return false}
  msg('');return true;
}
async function addLink(){
  if(!$('url').value.trim())return msg('Cole um link.',1);msg('Adicionando…');
  if(await cmd({cmd:'add',url:$('url').value.trim(),title:$('ttl').value,artist:$('art').value}))$('url').value=$('ttl').value=$('art').value='';
}
async function addFile(){
  const f=$('file').files[0];if(!f)return msg('Escolha um arquivo de áudio.',1);msg('Enviando…');
  if(await cmd({cmd:'add',title:$('ttl').value,artist:$('art').value},f)){$('file').value='';$('ttl').value=$('art').value=''}
}
function render(s){
  $('stat').textContent=s.playing?'🟢 No ar':'🔴 Parada';$('cnt').textContent=s.listeners;
  $('now').textContent=s.playing&&s.track?s.track.title:'—';$('n').textContent=s.playlist.length;
  $('list').innerHTML=s.playlist.map((t,i)=>`<div class="item ${s.playing&&i===s.index?'cur':''}">
    ${t.cover?`<img src="${t.cover}" alt="">`:'<i></i>'}
    <div>${esc(t.title)}<small>${esc(t.artist||'')} · ${t.kind}</small></div>
    <button onclick="cmd({cmd:'play',index:${i}})">▶</button>
    <button onclick="cmd({cmd:'move',id:'${t.id}',dir:-1})">↑</button>
    <button onclick="cmd({cmd:'move',id:'${t.id}',dir:1})">↓</button>
    <button class="red" onclick="cmd({cmd:'remove',id:'${t.id}'})">✕</button></div>`).join('')||'<p style="opacity:.85;font-size:14px">Playlist vazia.</p>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onopen=()=>ws.send(JSON.stringify({t:'hello',role:'admin'}));
  ws.onmessage=e=>render(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connect,2000);
})();
</script>
</body>
</html>
